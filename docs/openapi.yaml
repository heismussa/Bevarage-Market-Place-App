  /api/v1/cart/:
    get:
      operationId: v1_cart_retrieve
      description: Totals use CURRENT product prices. Only lines with counted_in_total=true
        (available and within stock) count toward subtotal; delivery_fee is 0 when
        none do. price_changed flags lines whose price differs from when they were
        added. Stock is not reserved. warnings lists every problem that would block
        checkout.
      summary: My cart
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              examples:
                Cart:
                  value:
                    store:
                      id: 1
                      store_name: ABC Drinks
                      logo: null
                      status: OPEN
                      delivery_fee: '2000.00'
                    items:
                    - id: 7
                      product_id: 1
                      name: Coca-Cola 500ml
                      image: null
                      unit: BOTTLE
                      unit_price: '1600.00'
                      price_when_added: '1500.00'
                      quantity: 2
                      line_total: '3200.00'
                      price_changed: true
                      available: true
                      max_available: 118
                      counted_in_total: true
                    item_count: 2
                    subtotal: '3200.00'
                    delivery_fee: '2000.00'
                    total: '5200.00'
                    warnings:
                    - code: PRICE_CHANGED
                      message: The price of Coca-Cola 500ml changed from 1500.00 to
                        1600.00.
