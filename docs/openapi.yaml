  /api/v1/admin/orders/{id}/cancel/:
    post:
      operationId: v1_admin_orders_cancel_create
      description: Cancels any order that is not yet COMPLETED, REJECTED or CANCELLED.
        The reason is required and shown to the customer. Stock is returned to the
        store.
      summary: Cancel any order (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCancelOrderRequest'
            examples:
              Cancel:
                value:
                  reason: Customer called support
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCancelOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCancelOrderRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
