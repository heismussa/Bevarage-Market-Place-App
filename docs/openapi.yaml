  /api/v1/owner/stores/{id}/orders/:
    get:
      operationId: v1_owner_stores_orders_list
      description: Newest first. date_from and date_to are local calendar days, both
        inclusive. search matches the order number or the customer's name. Cash orders
        appear at once; mobile-money orders appear only after payment_status is SUCCESS.
      summary: List my store's orders
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - CANCELLED
          - FAILED
          - PENDING
          - PROCESSING
          - REFUNDED
          - SUCCESS
        description: |-
          * `PENDING` - Pending
          * `PROCESSING` - Processing
          * `SUCCESS` - Success
          * `FAILED` - Failed
