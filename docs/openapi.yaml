openapi: 3.0.3
info:
  title: Beverage Delivery Marketplace API
  version: 1.0.0
  description: Backend foundation for the beverage delivery marketplace.
paths:
  /api/v1/addresses/:
    get:
      operationId: v1_addresses_list
      description: The default address comes first.
      summary: List my addresses
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: is_default
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
              examples:
                Address:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 1
                      address_name: Home
                      address_line: Plot 12, Haile Selassie Road
                      city: Dar es Salaam
                      area: Msasani
                      latitude: '-6.748900'
                      longitude: '39.276800'
                      phone: '+255712345678'
                      is_default: true
                      created_at: '2026-10-08T12:00:00+03:00'
                      updated_at: '2026-10-08T12:00:00+03:00'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: This field is required.
                      details:
                        field:
                        - This field is required.
                  summary: VALIDATION_ERROR
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOTAUTHENTICATED:
                  value:
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                      details: {}
                  summary: NOT_AUTHENTICATED
          description: Missing or invalid credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PERMISSIONDENIED:
                  value:
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                      details: {}
                  summary: PERMISSION_DENIED
          description: Role not allowed
    post:
      operationId: v1_addresses_create
      description: The first address a customer adds becomes the default automatically.
      summary: Add an address
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
            examples:
              NewAddress:
                value:
                  address_name: Home
                  address_line: Plot 12, Haile Selassie Road
                  city: Dar es Salaam
                  area: Msasani
                  latitude: '-6.748900'
                  longitude: '39.276800'
                  phone: '+255712345678'
                summary: New address
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              examples:
                Created:
                  value:
                    id: 1
                    address_name: Home
                    address_line: Plot 12, Haile Selassie Road
                    city: Dar es Salaam
                    area: Msasani
                    latitude: '-6.748900'
                    longitude: '39.276800'
                    phone: '+255712345678'
                    is_default: true
                    created_at: '2026-10-08T12:00:00+03:00'
                    updated_at: '2026-10-08T12:00:00+03:00'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATIONERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: This field is required.
                      details:
                        field:
                        - This field is required.
                  summary: VALIDATION_ERROR
          description: Invalid input
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOTAUTHENTICATED:
                  value:
                    error:
                      code: NOT_AUTHENTICATED
                      message: Authentication credentials were not provided.
                      details: {}
                  summary: NOT_AUTHENTICATED
          description: Missing or invalid credentials
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PERMISSIONDENIED:
                  value:
                    error:
                      code: PERMISSION_DENIED
                      message: You do not have permission to perform this action.
                      details: {}
                  summary: PERMISSION_DENIED
          description: Role not allowed
