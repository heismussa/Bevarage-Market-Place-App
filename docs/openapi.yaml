components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          default: 1
      required:
      - product_id
    Address:
      type: object
      description: |-
        is_default is read-only: the first address becomes default automatically and
        POST /addresses/{id}/set-default/ changes it.
      properties:
        id:
          type: integer
          readOnly: true
        address_name:
          type: string
          maxLength: 50
        address_line:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 80
        area:
          type: string
          nullable: true
          maxLength: 80
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        phone:
          type: string
          maxLength: 20
        is_default:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line
      - address_name
      - city
      - created_at
      - id
      - is_default
      - phone
      - updated_at
    AddressRequest:
      type: object
      description: |-
        is_default is read-only: the first address becomes default automatically and
        POST /addresses/{id}/set-default/ changes it.
      properties:
        address_name:
          type: string
          minLength: 1
          maxLength: 50
        address_line:
          type: string
          minLength: 1
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 80
        area:
          type: string
          nullable: true
          maxLength: 80
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - address_line
      - address_name
      - city
      - phone
    AdminCancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: Shown to the customer.
          maxLength: 500
      required:
      - reason
    Analytics:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        total_orders:
          type: integer
        completed_orders:
          type: integer
        pending_orders:
          type: integer
        total_sales:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        daily_sales:
          type: array
          items:
            $ref: '#/components/schemas/DailySales'
        top_products:
          type: array
          items:
            $ref: '#/components/schemas/TopProduct'
          description: Top 10 by quantity sold.
      required:
      - completed_orders
      - daily_sales
      - date_from
      - date_to
      - pending_orders
      - top_products
      - total_orders
      - total_sales
    AvailabilityStatusEnum:
      enum:
      - AVAILABLE
      - OUT_OF_STOCK
      - UNAVAILABLE
      type: string
