[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "C4", "SIM"]
# The ERD defines nullable varchar/text columns, which Django models as null=True.
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "core",
    "accounts",
    "stores",
    "catalog",
    "cart",
    "orders",
    "payments",
    "notifications",
]
